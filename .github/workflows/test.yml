name: Tests

# Runs the unit tests and the addon test on every pull request (and on pushes to other branches), so a change is
# checked before it is merged, including the weekly sim-bump PR. No secrets, read-only, no sim build: the tests that
# need the built sim (tests/run_analysis.mjs) still run in the deploy workflow.
on:
  pull_request:
  workflow_dispatch: # sim-bump.yml starts it on the bump branch (a PR opened with the built-in token starts nothing by itself)
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Unit tests
        run: npm test
      - name: Install Lua for the addon test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1
      - name: Addon test
        run: npm run test:addon
