name: Build sim and deploy

# Rebuilds the wowsims/forever sim to WebAssembly and publishes the page to GitHub Pages.
# The wowsims version is the git ref in SIM_REF (a branch, tag or commit); "Run workflow" can override it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      wowsims_ref:
        description: 'wowsims/forever branch, tag or commit (blank = SIM_REF)'
        required: false
  schedule:
    - cron: '0 9 * * 2' # Tuesdays, after the weekly reset, to pick up new sim fixes

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the wowsims version
        id: ref
        env:
          INPUT_REF: ${{ github.event.inputs.wowsims_ref }}
        run: |
          REF="$INPUT_REF"
          [ -n "$REF" ] || REF="$(tr -d '[:space:]' < SIM_REF)"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - name: Fetch wowsims/forever
        run: |
          git clone https://github.com/wowsims/forever .wowsims
          git -C .wowsims checkout "$REF"
        env:
          GIT_LFS_SKIP_SMUDGE: '1'
          REF: ${{ steps.ref.outputs.ref }}
      # Install the exact Go that wowsims asks for (its `toolchain` line, else its `go` line), so the build never
      # has to download a second Go mid-build (that download timed out once and failed the deploy).
      - name: Read the Go version wowsims needs
        id: gover
        run: |
          v=$(sed -n 's/^toolchain go//p' .wowsims/go.mod)
          [ -n "$v" ] || v=$(sed -n 's/^go //p' .wowsims/go.mod)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Go $v"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.gover.outputs.version }}
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install grpcio-tools
      - name: Build the sim
        env:
          GOTOOLCHAIN: local
        run: WOWSIMS_DIR=.wowsims SKIP_FETCH=1 scripts/build-sim.sh
      - name: Smoke test (parse the sample log and sim it)
        run: node tests/cooldowns_test.mjs && node tests/worker_test.mjs && node tests/wcl_proxy_test.mjs && node tests/run_analysis.mjs tests/fixture-WoWCombatLog.txt 50
      # Optional: the Worker that loads public Warcraft Logs reports without a sign-in (worker/). It deploys only
      # when the three secrets exist; without them the page keeps sign-in only.
      - name: Deploy the Warcraft Logs Worker
        # A Worker problem must not stop the site from deploying: the page falls back to sign-in.
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WCL_ID: ${{ secrets.WCL_SERVER_CLIENT_ID }}
          WCL_SECRET: ${{ secrets.WCL_SERVER_CLIENT_SECRET }}
        working-directory: worker
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$WCL_ID" ] || [ -z "$WCL_SECRET" ]; then
            echo "Worker secrets not set; the page keeps Warcraft Logs sign-in only."; exit 0
          fi
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' "$@"; }
          acct="$CLOUDFLARE_ACCOUNT_ID"
          [ -n "$acct" ] || acct=$(api https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id // empty')
          # A new Cloudflare account has no workers.dev address until one is picked. Pick one here if needed.
          if [ -n "$acct" ]; then
            sub=$(api "https://api.cloudflare.com/client/v4/accounts/$acct/workers/subdomain" | jq -r '.result.subdomain // empty')
            if [ -z "$sub" ]; then
              for name in warrior-dps-analyzer "warrior-dps-analyzer-${acct:0:6}"; do
                if api -X PUT "https://api.cloudflare.com/client/v4/accounts/$acct/workers/subdomain" -d "{\"subdomain\":\"$name\"}" | jq -e .success >/dev/null; then
                  echo "Registered $name.workers.dev"; break
                fi
              done
            fi
            export CLOUDFLARE_ACCOUNT_ID="$acct"
          else
            unset CLOUDFLARE_ACCOUNT_ID
          fi
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -o 'https://[A-Za-z0-9.-]*\.workers\.dev' deploy.log | head -1)
          [ -n "$url" ] || { echo "::error::Could not find the Worker address in the wrangler output."; exit 1; }
          printf '%s' "$WCL_ID" | npx --yes wrangler@4 secret put WCL_CLIENT_ID
          printf '%s' "$WCL_SECRET" | npx --yes wrangler@4 secret put WCL_CLIENT_SECRET
          printf '{"url":"%s"}\n' "$url" > ../web/wcl-proxy.json
          echo "Worker live at $url"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
