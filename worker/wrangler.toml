# Deployed by .github/workflows/deploy.yml when the CLOUDFLARE_API_TOKEN, WCL_SERVER_CLIENT_ID and
# WCL_SERVER_CLIENT_SECRET repo secrets exist. The WCL id and secret are set as Worker secrets, never in this file.
name = "warrior-dps-analyzer-wcl"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://dogshep.github.io"

# Per-IP limit on requests that miss the cache (the ones that spend the site's Warcraft Logs quota).
# A long fight takes about 15 requests, so 60 a minute leaves room for normal use.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
